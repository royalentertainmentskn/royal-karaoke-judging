<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Royal Karaoke SKN Championship</title>
  <link rel="stylesheet" href="style.css?v=1.5.1">
  <style>
    #boot-error { display:none; max-width:900px; margin:30px auto; padding:20px; border:2px solid #c00; border-radius:10px; font-family:Arial,sans-serif; }
    #boot-error pre { white-space:pre-wrap; overflow-wrap:anywhere; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="boot-error">
    <h2>Royal Karaoke SKN could not start</h2>
    <p>The browser reported an application loading error.</p>
    <pre id="boot-error-text"></pre>
  </div>
  <script>
    window.addEventListener('error', function(e) {
      var box=document.getElementById('boot-error'), text=document.getElementById('boot-error-text');
      if(box && text){ box.style.display='block'; text.textContent=(e.message || 'Unknown error') + (e.filename ? '\n\nFile: '+e.filename+'\nLine: '+e.lineno : ''); }
    });
    window.addEventListener('unhandledrejection', function(e) {
      var box=document.getElementById('boot-error'), text=document.getElementById('boot-error-text');
      if(box && text){ box.style.display='block'; text.textContent='Unhandled error: ' + (e.reason && e.reason.message ? e.reason.message : String(e.reason)); }
    });
  </script>
  <script type="module" src="app.js?v=1.5.1"></script>
</body>
</html>
